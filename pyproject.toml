[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-final-synthesis"
version = "0.1.0"
description = "Local research framework for synthetic-data generation, utility evaluation, privacy auditing, and repeatable experiments"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lifelines>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
sora-synth = "sora_synth.cli:main"
sora-lab = "sora_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
